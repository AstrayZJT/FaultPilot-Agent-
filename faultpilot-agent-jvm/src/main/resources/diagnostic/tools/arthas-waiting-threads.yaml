apiVersion: faultpilot/v1
kind: DiagnosticTool
metadata:
  name: query_arthas_waiting_threads
  version: 1.0.0
spec:
  ownerAgent: JVM_AGENT
  description: Execute the fixed bounded Arthas waiting-thread command and locate blocking application frames.
  endpoint:
    ref: arthas
    path: /api
    method: POST
  request:
    query: {}
    body:
      action:
        value: exec
      command:
        value: thread --state WAITING -n 50
  response:
    parser: ARTHAS_WAITING_THREADS
    resultPath: body.results
    aggregation: COUNT
    evidence:
      rule: NON_EMPTY
      trueType: BLOCKING_TASK_FOUND
      trueSummary: Arthas identified WAITING application thread(s)
      sourceTemplate: arthas:{serviceName}:waiting-threads
  limits:
    timeoutSeconds: 8
    maxResponseBytes: 262144
    maxItems: 8
  riskLevel: READ_ONLY
