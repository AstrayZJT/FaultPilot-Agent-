spring:
  application:
    name: faultpilot-agent-jvm
  datasource:
    url: ${JVM_AGENT_DB_URL:jdbc:h2:file:./data/jvm-agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${JVM_AGENT_DB_USERNAME:sa}
    password: ${JVM_AGENT_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${JVM_AGENT_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info

faultpilot:
  model:
    base-url: ${MODEL_BASE_URL:}
    model-name: ${MODEL_NAME:qwen3.7-max}
    api-key: ${QWEN_API_KEY:}
    timeout-seconds: ${MODEL_TIMEOUT_SECONDS:90}
  jvm-agent:
    agent-id: jvm-agent
    name: FaultPilot JVM Agent
    capability-version: ${JVM_AGENT_CAPABILITY_VERSION:1.0.0}
    protocol-version: "1.0"
    public-url: ${JVM_AGENT_PUBLIC_URL:http://localhost:8091/a2a}
    a2a-token: ${JVM_AGENT_A2A_TOKEN:}
    central-base-url: ${FAULTPILOT_INTERNAL_URL:http://localhost:8080}
    central-token: ${FAULTPILOT_AGENT_API_TOKEN:}
    task-threads: ${JVM_AGENT_TASK_THREADS:4}
    thresholds:
      processCpuHigh: ${PROCESS_CPU_HIGH_THRESHOLD:0.80}
      threadPoolSaturation: ${THREAD_POOL_SATURATION_RATIO:0.90}
    endpoints:
      prometheus:
        base-url: ${PROMETHEUS_URL:http://localhost:9090}
        bearer-token: ${PROMETHEUS_BEARER_TOKEN:}
    services:
      order-service:
        prometheus-labels:
          job: ${ORDER_SERVICE_PROMETHEUS_JOB:faultpilot-lab-order}
        arthas-base-url: ${ORDER_SERVICE_ARTHAS_URL:}
        arthas-username: ${ORDER_SERVICE_ARTHAS_USERNAME:}
        arthas-password: ${ORDER_SERVICE_ARTHAS_PASSWORD:}
        code-package-prefixes:
          - ${ORDER_SERVICE_CODE_PACKAGE_PREFIX:}
      inventory-service:
        prometheus-labels:
          job: ${INVENTORY_SERVICE_PROMETHEUS_JOB:faultpilot-lab-inventory}
        arthas-base-url: ${INVENTORY_SERVICE_ARTHAS_URL:}
        arthas-username: ${INVENTORY_SERVICE_ARTHAS_USERNAME:}
        arthas-password: ${INVENTORY_SERVICE_ARTHAS_PASSWORD:}
        code-package-prefixes:
          - ${INVENTORY_SERVICE_CODE_PACKAGE_PREFIX:}

logging:
  pattern:
    level: "%5p [jvmAgentTask:%X{jvmAgentTaskId:-}]"
