spring:
  application:
    name: faultpilot-lab-order
  datasource:
    url: ${LAB_DB_URL:jdbc:postgresql://localhost:55432/faultpilot_lab}
    username: ${LAB_DB_USERNAME:lab_service}
    password: ${LAB_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${LAB_DB_MAX_POOL_SIZE:10}
  data:
    redis:
      host: ${LAB_REDIS_HOST:localhost}
      port: ${LAB_REDIS_PORT:56379}
      username: ${LAB_REDIS_USERNAME:}
      password: ${LAB_REDIS_PASSWORD:}
      database: ${LAB_REDIS_DATABASE:0}
      timeout: ${LAB_REDIS_TIMEOUT:2s}
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
