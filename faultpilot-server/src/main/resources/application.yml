spring:
  application:
    name: faultpilot-server
  datasource:
    url: ${FAULTPILOT_DB_URL:jdbc:postgresql://localhost:55432/faultpilot}
    username: ${FAULTPILOT_DB_USERNAME:faultpilot_app}
    password: ${FAULTPILOT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${FAULTPILOT_DB_MAX_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

faultpilot:
  orchestration:
    mode: ${FAULTPILOT_ORCHESTRATION_MODE:LOOP}
    max-rounds: ${FAULTPILOT_MAIN_AGENT_MAX_ROUNDS:4}
    max-delegations: ${FAULTPILOT_MAIN_AGENT_MAX_DELEGATIONS:8}
    run-timeout-seconds: ${FAULTPILOT_RUN_TIMEOUT_SECONDS:180}
  declarative:
    enabled: ${FAULTPILOT_DECLARATIVE_TOOLS_ENABLED:true}
    tool-locations:
      - classpath*:diagnostic/tools/*.yaml
    skill-locations:
      - classpath*:diagnostic/skills/*/skill.yaml
    allowed-endpoint-refs:
      - prometheus
      - arthas
      - postgres
      - redis
      - trace
    http:
      mode: ${FAULTPILOT_DECLARATIVE_EXECUTION_MODE:LOCAL}
      endpoints:
        prometheus:
          base-url: ${PROMETHEUS_URL:http://localhost:9090}
          bearer-token: ${PROMETHEUS_BEARER_TOKEN:}
        arthas:
          base-url: ${ARTHAS_GATEWAY_URL:}
          bearer-token: ${ARTHAS_GATEWAY_TOKEN:}
        postgres:
          base-url: ${POSTGRES_DIAGNOSTIC_API_URL:}
          bearer-token: ${POSTGRES_DIAGNOSTIC_API_TOKEN:}
        redis:
          base-url: ${REDIS_DIAGNOSTIC_API_URL:}
          bearer-token: ${REDIS_DIAGNOSTIC_API_TOKEN:}
        trace:
          base-url: ${TRACE_DIAGNOSTIC_API_URL:}
          bearer-token: ${TRACE_DIAGNOSTIC_API_TOKEN:}
  integration:
    mode: ${FAULTPILOT_INTEGRATION_MODE:LAB}
  agents:
    transport: ${FAULTPILOT_SPECIALIST_TRANSPORT:LOCAL}
    timeout-seconds: ${FAULTPILOT_AGENT_DISCOVERY_TIMEOUT_SECONDS:5}
    request-timeout-seconds: ${FAULTPILOT_A2A_REQUEST_TIMEOUT_SECONDS:5}
    task-timeout-seconds: ${FAULTPILOT_A2A_TASK_TIMEOUT_SECONDS:60}
    poll-interval-millis: ${FAULTPILOT_A2A_POLL_INTERVAL_MILLIS:250}
    max-retries: ${FAULTPILOT_A2A_MAX_RETRIES:2}
    protocol-version: "1.0"
    local-versions:
      JVM_AGENT: ${JVM_AGENT_CAPABILITY_VERSION:local-1.0.0}
      DATABASE_AGENT: ${DATABASE_AGENT_CAPABILITY_VERSION:local-1.0.0}
      CACHE_AGENT: ${CACHE_AGENT_CAPABILITY_VERSION:local-1.0.0}
      DEPENDENCY_AGENT: ${DEPENDENCY_AGENT_CAPABILITY_VERSION:local-1.0.0}
    endpoints:
      jvm-agent:
        agent-type: JVM_AGENT
        card-url: ${JVM_AGENT_CARD_URL:http://localhost:8091/.well-known/agent-card.json}
        bearer-token: ${JVM_AGENT_A2A_TOKEN:}
        required: true
      database-agent:
        agent-type: DATABASE_AGENT
        card-url: ${DATABASE_AGENT_CARD_URL:http://localhost:8092/.well-known/agent-card.json}
        bearer-token: ${DATABASE_AGENT_A2A_TOKEN:}
        required: false
      cache-agent:
        agent-type: CACHE_AGENT
        card-url: ${CACHE_AGENT_CARD_URL:http://localhost:8093/.well-known/agent-card.json}
        bearer-token: ${CACHE_AGENT_A2A_TOKEN:}
        required: false
      dependency-agent:
        agent-type: DEPENDENCY_AGENT
        card-url: ${DEPENDENCY_AGENT_CARD_URL:http://localhost:8094/.well-known/agent-card.json}
        bearer-token: ${DEPENDENCY_AGENT_A2A_TOKEN:}
        required: false
  agent:
    specialist-deadline-seconds: ${FAULTPILOT_SPECIALIST_DEADLINE_SECONDS:120}
  observability:
    prometheus-url: ${PROMETHEUS_URL:http://localhost:9090}
    timeout-seconds: ${OBSERVABILITY_TIMEOUT_SECONDS:5}
    process-cpu-high-threshold: ${PROCESS_CPU_HIGH_THRESHOLD:0.80}
    thread-pool-saturation-ratio: ${THREAD_POOL_SATURATION_RATIO:0.90}
    heap-usage-high-ratio: ${HEAP_USAGE_HIGH_RATIO:0.90}
    http-latency-high-seconds: ${HTTP_LATENCY_HIGH_SECONDS:1.0}
    redis-command-latency-high-seconds: ${REDIS_COMMAND_LATENCY_HIGH_SECONDS:0.20}
    redis-memory-usage-high-ratio: ${REDIS_MEMORY_USAGE_HIGH_RATIO:0.90}
    redis-evictions-high-threshold: ${REDIS_EVICTIONS_HIGH_THRESHOLD:1}
    redis-slow-command-threshold-micros: ${REDIS_SLOW_COMMAND_THRESHOLD_MICROS:10000}
    redis-cache-hit-rate-low-ratio: ${REDIS_CACHE_HIT_RATE_LOW_RATIO:0.80}
    database-slow-query-threshold-millis: ${DATABASE_SLOW_QUERY_THRESHOLD_MILLIS:1000}
    database-holding-query-threshold-millis: ${DATABASE_HOLDING_QUERY_THRESHOLD_MILLIS:1000}
    trace-slow-span-threshold-millis: ${TRACE_SLOW_SPAN_THRESHOLD_MILLIS:1000}
  remediation:
    enabled: ${FAULTPILOT_REMEDIATION_ENABLED:true}
  security:
    viewer-password: ${FAULTPILOT_SECURITY_VIEWER_PASSWORD:}
    operator-password: ${FAULTPILOT_SECURITY_OPERATOR_PASSWORD:}
    admin-password: ${FAULTPILOT_SECURITY_ADMIN_PASSWORD:}
    alertmanager-token: ${FAULTPILOT_SECURITY_ALERTMANAGER_TOKEN:}
    agent-token: ${FAULTPILOT_AGENT_API_TOKEN:}
  catalog:
    services:
      order-service:
        prometheus-labels:
          job: ${ORDER_SERVICE_PROMETHEUS_JOB:faultpilot-lab-order}
        actuator-base-url: ${ORDER_SERVICE_URL:http://localhost:8081}
        database-ref: lab-postgres
        redis-ref: ${ORDER_SERVICE_REDIS_REF:lab-redis}
        downstreams:
          - inventory-service
        allowed-actions:
          - STOP_CPU_FAULT
          - RELEASE_BLOCKED_TASKS
          - RESTORE_INDEXED_QUERY
          - RELEASE_HELD_CONNECTIONS
        arthas-base-url: ${ORDER_SERVICE_ARTHAS_URL:}
        arthas-username: ${ORDER_SERVICE_ARTHAS_USERNAME:}
        arthas-password: ${ORDER_SERVICE_ARTHAS_PASSWORD:}
        code-package-prefixes:
          - ${ORDER_SERVICE_CODE_PACKAGE_PREFIX:}
        trace-ref: ${ORDER_SERVICE_TRACE_REF:}
        trace-service-name: ${ORDER_SERVICE_TRACE_SERVICE_NAME:order-service}
      inventory-service:
        prometheus-labels:
          job: ${INVENTORY_SERVICE_PROMETHEUS_JOB:faultpilot-lab-inventory}
        actuator-base-url: ${INVENTORY_SERVICE_URL:http://localhost:18082}
        database-ref: lab-postgres
        downstreams: []
        allowed-actions:
          - RESTORE_DEPENDENCY_LATENCY
        arthas-base-url: ${INVENTORY_SERVICE_ARTHAS_URL:}
        arthas-username: ${INVENTORY_SERVICE_ARTHAS_USERNAME:}
        arthas-password: ${INVENTORY_SERVICE_ARTHAS_PASSWORD:}
        code-package-prefixes:
          - ${INVENTORY_SERVICE_CODE_PACKAGE_PREFIX:}
        trace-ref: ${INVENTORY_SERVICE_TRACE_REF:}
        trace-service-name: ${INVENTORY_SERVICE_TRACE_SERVICE_NAME:inventory-service}
  redis:
    instances:
      lab-redis:
        host: ${LAB_REDIS_HOST:localhost}
        port: ${LAB_REDIS_PORT:56379}
        username: ${LAB_REDIS_USERNAME:}
        password: ${LAB_REDIS_PASSWORD:}
        tls: ${LAB_REDIS_TLS:false}
        database: ${LAB_REDIS_DATABASE:0}
        slow-log-limit: ${REDIS_SLOW_LOG_LIMIT:10}
  database:
    instances:
      lab-postgres:
        jdbc-url: ${LAB_DIAGNOSTIC_DB_URL:jdbc:postgresql://localhost:55432/faultpilot_lab}
        username: ${LAB_DIAGNOSTIC_DB_USERNAME:faultpilot_diagnostic}
        password: ${FAULTPILOT_DIAGNOSTIC_PASSWORD:}
        query-timeout-seconds: ${DATABASE_DIAGNOSTIC_QUERY_TIMEOUT_SECONDS:3}
        max-rows: ${DATABASE_DIAGNOSTIC_MAX_ROWS:20}
  model:
    base-url: ${MODEL_BASE_URL:}
    model-name: ${MODEL_NAME:qwen3.7-max}
    api-key: ${QWEN_API_KEY:}
    temperature: ${MODEL_TEMPERATURE:0}
    timeout-seconds: ${MODEL_TIMEOUT_SECONDS:90}
    required: ${FAULTPILOT_REQUIRE_REMOTE_MODEL:true}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
