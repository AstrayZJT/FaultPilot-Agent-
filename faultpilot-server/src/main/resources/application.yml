spring:
  application:
    name: faultpilot-server
  datasource:
    url: ${FAULTPILOT_DB_URL:jdbc:postgresql://localhost:55432/faultpilot}
    username: ${FAULTPILOT_DB_USERNAME:faultpilot_app}
    password: ${FAULTPILOT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${FAULTPILOT_DB_MAX_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

faultpilot:
  model:
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model-name: ${QWEN_MODEL:qwen3.7-plus}
    api-key: ${QWEN_API_KEY:}
    temperature: ${QWEN_TEMPERATURE:0}
    timeout-seconds: ${QWEN_TIMEOUT_SECONDS:8}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
