global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: faultpilot-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8080]

  - job_name: faultpilot-lab-order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8081]

  - job_name: faultpilot-lab-inventory
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:18082]
