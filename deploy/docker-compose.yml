services:
  postgres:
    image: postgres:16
    container_name: faultpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      FAULTPILOT_APP_PASSWORD: ${FAULTPILOT_APP_PASSWORD:?Set FAULTPILOT_APP_PASSWORD in .env}
      LAB_SERVICE_PASSWORD: ${LAB_SERVICE_PASSWORD:?Set LAB_SERVICE_PASSWORD in .env}
      FAULTPILOT_DIAGNOSTIC_PASSWORD: ${FAULTPILOT_DIAGNOSTIC_PASSWORD:?Set FAULTPILOT_DIAGNOSTIC_PASSWORD in .env}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - faultpilot-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: faultpilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - faultpilot-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7.4-alpine
    container_name: faultpilot-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${LAB_REDIS_PASSWORD:?Set LAB_REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server --appendonly no --save '' --requirepass "$$REDIS_PASSWORD"
        --slowlog-log-slower-than 10000 --slowlog-max-len 128
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: faultpilot-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${LAB_REDIS_PASSWORD:?Set LAB_REDIS_PASSWORD in .env}
    depends_on:
      redis:
        condition: service_healthy

  jvm-agent:
    profiles: ["distributed-agents"]
    build:
      context: ..
      dockerfile: faultpilot-agent-jvm/Dockerfile
    container_name: faultpilot-agent-jvm
    restart: unless-stopped
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-qwen3.7-max}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-90}
      JVM_AGENT_A2A_TOKEN: ${JVM_AGENT_A2A_TOKEN:-}
      FAULTPILOT_AGENT_API_TOKEN: ${FAULTPILOT_AGENT_API_TOKEN:-}
      FAULTPILOT_INTERNAL_URL: ${FAULTPILOT_INTERNAL_URL:-http://host.docker.internal:8080}
      JVM_AGENT_PUBLIC_URL: ${JVM_AGENT_PUBLIC_URL:-http://localhost:8091/a2a}
      JVM_AGENT_CAPABILITY_VERSION: ${JVM_AGENT_CAPABILITY_VERSION:-1.0.0}
      JVM_AGENT_DB_URL: jdbc:h2:file:/app/data/jvm-agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
      PROMETHEUS_URL: http://prometheus:9090
      ORDER_SERVICE_PROMETHEUS_JOB: ${ORDER_SERVICE_PROMETHEUS_JOB:-faultpilot-lab-order}
      ORDER_SERVICE_ARTHAS_URL: ${ORDER_SERVICE_ARTHAS_URL:-}
      ORDER_SERVICE_ARTHAS_USERNAME: ${ORDER_SERVICE_ARTHAS_USERNAME:-}
      ORDER_SERVICE_ARTHAS_PASSWORD: ${ORDER_SERVICE_ARTHAS_PASSWORD:-}
      ORDER_SERVICE_CODE_PACKAGE_PREFIX: ${ORDER_SERVICE_CODE_PACKAGE_PREFIX:-}
      INVENTORY_SERVICE_PROMETHEUS_JOB: ${INVENTORY_SERVICE_PROMETHEUS_JOB:-faultpilot-lab-inventory}
      INVENTORY_SERVICE_ARTHAS_URL: ${INVENTORY_SERVICE_ARTHAS_URL:-}
      INVENTORY_SERVICE_ARTHAS_USERNAME: ${INVENTORY_SERVICE_ARTHAS_USERNAME:-}
      INVENTORY_SERVICE_ARTHAS_PASSWORD: ${INVENTORY_SERVICE_ARTHAS_PASSWORD:-}
      INVENTORY_SERVICE_CODE_PACKAGE_PREFIX: ${INVENTORY_SERVICE_CODE_PACKAGE_PREFIX:-}
    ports:
      - "${JVM_AGENT_PORT:-8091}:8091"
    volumes:
      - faultpilot-jvm-agent-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  faultpilot-postgres-data:
  faultpilot-prometheus-data:
  faultpilot-jvm-agent-data:
